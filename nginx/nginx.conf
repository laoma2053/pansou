user nginx;
worker_processes 16;                # 明确设置为16，匹配16核CPU
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# 16核高并发优化 - 必须在main上下文中
worker_rlimit_nofile 65536;        # 启用文件描述符限制优化

events {
    worker_connections 4096;        # 增加到4096，充分利用16核性能
    multi_accept on;               # 允许worker同时接受多个连接
    use epoll;                     # 明确使用epoll（Linux高性能）
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # 限流配置 - 基于16核高性能服务器调整
    limit_req_zone $binary_remote_addr zone=api_limit:30m rate=30r/m;    # 增加到每分钟30次
    limit_req_zone $binary_remote_addr zone=search_limit:30m rate=100r/m; # 增加到每分钟100次，匹配16核高并发
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 120;          # 匹配高性能服务器，增加连接保持时间
    keepalive_requests 2000;        # 16核服务器每个连接最多处理2000个请求
    types_hash_max_size 4096;       # 增加hash表大小，匹配16核性能
    client_max_body_size 50m;       # 增加请求体大小限制，适应大文件
    
    # 禁用gzip压缩 - 与应用层ENABLE_COMPRESSION=false保持一致
    # 避免双重压缩和不必要的CPU开销
    gzip off;
    
    include /etc/nginx/conf.d/*.conf;
}
