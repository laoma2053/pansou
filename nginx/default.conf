server {
    listen 80;
    server_name _;  # 接受所有域名，由1Panel反向代理处理
    root /usr/share/nginx/html;
    index index.html;
    
    # 安全设置：添加访问控制
    # 只允许来自前端页面的请求访问API
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # 静态文件缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Served-By "nginx";
    }
    
    # robots.txt 专用配置 - 确保正确的Content-Type，避免脚本注入
    location = /robots.txt {
        add_header Content-Type text/plain;
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Served-By "nginx";
        
        # 确保直接返回文件，不经过任何处理
        try_files $uri =404;
    }
    
    # sitemap.xml 专用配置
    location = /sitemap.xml {
        add_header Content-Type application/xml;
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Served-By "nginx";
        
        try_files $uri =404;
    }
    
    # 健康检查API专用配置 - 精确匹配，确保唯一处理
    location = /api/health {
        # 支持GET和HEAD方法
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        
        proxy_pass http://pansou-api:8888/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 完全禁用缓冲和缓存
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        # 超时配置 - 匹配应用层ASYNC_RESPONSE_TIMEOUT=2秒
        proxy_connect_timeout 3s;      # 连接超时3秒
        proxy_send_timeout 5s;         # 发送超时5秒  
        proxy_read_timeout 5s;         # 读取超时5秒，匹配快速响应
        
        # 支持HEAD请求
        proxy_method $request_method;
        
        # 添加唯一标识头，便于调试
        add_header X-Location-Matched "health-exact";
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
    }

    # 搜索API专用配置 - 精确匹配
    location = /api/search {
        limit_req zone=search_limit burst=20 nodelay;
        limit_req_status 429;
        
        proxy_pass http://pansou-api:8888/api/search;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时配置 - 匹配应用层ASYNC_RESPONSE_TIMEOUT=2秒设置
        proxy_connect_timeout 3s;      # 连接超时3秒
        proxy_send_timeout 5s;         # 发送超时5秒
        proxy_read_timeout 5s;         # 读取超时5秒，确保快速响应
        proxy_buffering on;
        proxy_buffer_size 256k;        # 增加缓冲区，匹配16核性能
        proxy_buffers 16 512k;         # 16个缓冲区，匹配16核
        proxy_busy_buffers_size 512k;  # 增加忙碌缓冲区大小
        
        client_max_body_size 50m;      # 增加请求体限制，匹配nginx.conf设置
        proxy_request_buffering off;
        
        add_header X-Location-Matched "search-exact";
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";
    }

    # 其他API代理 - 排除已精确匹配的路径，应用16核优化
    location ~ ^/api/(?!health$|search$) {
        # 应用API限流规则 - 匹配16核高并发
        limit_req zone=api_limit burst=15 nodelay;  # 增加突发请求到15
        limit_req_status 429;
        
        proxy_pass http://pansou-api:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时配置 - 匹配应用层2秒快速响应
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        proxy_buffering on;
        
        add_header X-Location-Matched "api-other";
        add_header Access-Control-Allow-Origin *;
    }
    
    # 前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Served-By "nginx";
    }
    
    # nginx专用健康检查端点 - 使用不同的路径避免与API冲突
    location = /nginx-status {
        access_log off;
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }
    
    # 错误页面
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
