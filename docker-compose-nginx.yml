version: "3.8"

services:
  # PanSou后端API服务
  pansou-api:
    image: ghcr.io/fish2018/pansou:latest
    container_name: pansou-api
    restart: unless-stopped
    ports:
      - "8888:8888" # 恢复端口暴露，保持健康检查正常工作
    environment:
      # ================================
      # 🚀 基础配置
      # ================================
      - PORT=8888 # 服务端口 (默认: 8888) - 修改服务监听端口
      - CHANNELS=xingqiump4,yunpanqk,kkxlzy,share_aliyun,NewAliPan,ypquark,alyp_TV,alyp_4K_Movies,NewQuark,kuakeyun,Maidanglaocom,tgsearchers115,alyp_Animation,alyp_JLP,Aliyun_4k_Movies,Lossless_Yinyue,pikpakpan,ruanjianfenxiang77,tgsearchers6,Aliyun_4K_Movies,bdbdndn11,yunpanx,bsbdbfjfjff,yp123pan,sbsbsnsqq,yunpanxunlei,tianyifc,BaiduCloudDisk,txtyzy,peccxinpd,gotopan,PanjClub,baicaoZY,MCPH01,MCPH02,MCPH03,bdwpzhpd,ysxb48,jdjdn1111,yggpan,MCPH086,zaihuayun,Q66Share,ucwpzy,shareAliyun,alyp_1,dianyingshare,Quark_Movies,XiangxiuNBB,ydypzyfx,ucquark,xx123pan,yingshifenxiang123,zyfb123,tyypzhpd,tianyirigeng,cloudtianyi,hdhhd21,Lsp115,oneonefivewpfx,qixingzhenren,taoxgzy,Channel_Shares_115,tyysypzypd,vip115hot,wp123zy,yunpan139,yunpan189,yunpanuc,yydf_hzl,leoziyuan,Q_dongman,yoyokuakeduanju,TG654TG,WFYSFX02,QukanMovie,yeqingjie_GJG666,movielover8888_film3,Baidu_netdisk,D_wusun,FLMdongtianfudi,KaiPanshare,QQZYDAPP,rjyxfx,PikPak_Share_Channel,btzhi,newproductsourcing,cctv1211,duan_ju,QuarkFree,yunpanNB,kkdj001,xxzlzn,pxyunpanxunlei,jxwpzy,kuakedongman,liangxingzhinan,xiangnikanj,solidsexydoll,guoman4K,zdqxm,kduanju,cilidianying,CBduanju,SharePanFilms,dzsgx,BooksRealm,Oscar_4Kmovies,douerpan,baidu_yppan,Q_jilupian,Netdisk_Movies,yunpanquark,ammmziyuan,ciliziyuanku,cili8888,jzmm_123pan,Q_dianying,domgmingapk,dianying4k,q_dianshiju,tgbokee,ucshare,godupan,gokuapan,gimy115,WFYSFX03,peccxin,Movie888035,xlwpzy,zyywpzy,wydwpzy,gimy100,gimy115iso,aliyunys,clouddriveresources,XunLeiPinDao,ydwpzy,a123fxme,WPpindao,kuyupan,djya5,yingshiziyuanpindao,zh_vip,pan_guangya # 默认搜索的TG频道 (默认: tgsearchers3) - 多个频道用逗号分隔
      - ENABLED_PLUGINS=hunhepan,jikepan,panwiki,pansearch,panta,qupansou,hdr4k,pan666,susu,wanou,xuexizhinan,panyq,zhizhen,labi,muou,ouge,shandian,duoduo,huban,cyg,erxiao,miaoso,fox4k,pianku,xiaozhang,libvio,leijing,xb6v,xys,ddys,hdmoli,javdb,jutoushe,sdso,xiaoji,xdyh,haisou,bixin,djgou,nyaa,xinjuc,aikanzy,qupanshe,xdpan,discourse,yunsou,qqpd,ahhhhfs,nsgame,gying,quark4k,quarksoo,sousou,ash,weibo,feikuai,kkmao,alupan,ypfxw,mikuclub,daishudj,dyyj,meitizy,jsnoteclub,mizixing,lou1,yiove,zxzj,qingying,kkv,yulinshufa,duanjuw,jupansou,lingjisp,quarktv,dyyjpro,gaoqing888,panlian,panzun # 插件配置(镜像已包含推荐插件，如需自定义可取消注释并修改) 纯磁力的 clmao,wuji,cldi,yuhuage,u3c3,clxiong,thepiratebay
      # ================================
      # ⚙ 性能优化配置 (非默认值)
      # ================================
      - ASYNC_RESPONSE_TIMEOUT=2 # 快速响应超时时间(秒) (默认: 4) - 从4秒改为2秒，提升响应速度
      - ASYNC_LOG_ENABLED=false # 异步插件详细日志 (默认: true) - 关闭详细日志，减少I/O开销
      - CACHE_PATH=/app/cache # 缓存文件路径 (默认: ./cache) - 使用绝对路径，确保缓存目录正确
      - AUTH_ENABLED=false # 安全认证是否启用 (默认: true) - 临时禁用认证，简化访问测试
      #- CACHE_TTL=600              # 缓存有效期(分钟) (默认: 60) - 搜索结果缓存时长
      #- CACHE_WRITE_STRATEGY=immediate # 缓存立即写入 (默认: hybrid) - 确保TG结果快速缓存

      # ================================
      # ⚡ 基于16核16GB服务器的硬件优化
      # ================================
      - GC_PERCENT=200 # Go GC触发百分比 (默认: 100) - 减少GC频率，适合大内存服务器
      - SHARD_COUNT=16 # 缓存分片数量 (默认: 8) - 与CPU核心数匹配，减少缓存锁竞争
      - CACHE_MAX_SIZE=800 # 最大缓存大小(MB) (默认: 100) - 充分利用16GB内存
      - MIN_SIZE_TO_COMPRESS=2048 # 最小压缩阈值(字节) (默认: 1024) - 减少小文件压缩的CPU开销

      # ================================
      # 📝 采用默认值的配置项 (已注释，仅供参考)
      # ================================
      # - ENABLE_COMPRESSION=false  # 是否启用压缩 (默认: false) - 临时禁用压缩测试重复响应问题
      # - CONCURRENCY=auto          # 并发搜索数 (默认: 自动计算) - 自动设置为频道数+插件数+10
      # - CACHE_TTL=60              # 缓存有效期(分钟) (默认: 60) - 搜索结果缓存时长
      # - PLUGIN_TIMEOUT=30         # 插件超时时间(秒) (默认: 30) - 单个插件最大执行时间
      # - CACHE_WRITE_STRATEGY=hybrid # 缓存写入策略 (默认: hybrid) - immediate立即写入/hybrid混合策略
      # - ASYNC_MAX_BACKGROUND_WORKERS=80 # 最大后台工作者数量 (默认: CPU核心数×5=16×5=80) - 异步任务工作线程数
      # - ASYNC_MAX_BACKGROUND_TASKS=400  # 最大后台任务数量 (默认: 工作者数×5=80×5=400) - 任务队列最大容量
      # - ASYNC_CACHE_TTL_HOURS=1   # 异步缓存有效期(小时) (默认: 1) - 异步任务结果缓存时长
      # - ASYNC_PLUGIN_ENABLED=true # 异步插件是否启用 (默认: true) - 是否启用异步插件搜索
      # - ENABLED_PLUGINS=all       # 指定启用插件 (默认: 所有) - 多个插件用逗号分隔，不指定则全部启用
      # - HTTP_READ_TIMEOUT=auto    # HTTP读取超时(秒) (默认: 自动计算) - HTTP请求读取超时时间
      # - HTTP_WRITE_TIMEOUT=auto   # HTTP写入超时(秒) (默认: 自动计算) - HTTP响应写入超时时间
      # - HTTP_IDLE_TIMEOUT=120     # HTTP空闲超时(秒) (默认: 120) - 连接空闲超时时间
      # - HTTP_MAX_CONNS=auto       # HTTP最大连接数 (默认: 自动计算) - 最大并发连接数
      # - PROXY=                    # SOCKS5代理 (默认: 无) - 如: socks5://127.0.0.1:1080

    volumes:
      - pansou-cache:/app/cache
    networks:
      - pansou-network

    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://localhost:8888/api/health"]
      interval: 30s
      timeout: 5s # 进一步增加超时时间，适应更大资源配置
      retries: 3
      start_period: 10s # 增加启动时间，确保所有worker充分初始化

  # Nginx服务，提供前端页面和API代理
  pansou-web:
    image: nginx:alpine
    container_name: pansou-web
    restart: unless-stopped
    ports:
      - "8887:80" # 宿主机8887端口，容器内80端口（nginx默认端口）
    volumes:
      - ./web:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      pansou-api:
        condition: service_healthy
    networks:
      - pansou-network

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pansou-cache:
    driver: local

networks:
  pansou-network:
    driver: bridge
